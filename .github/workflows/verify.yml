name: Verify portable downloads
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Test SSH capacity recovery
        run: python -m unittest discover -s tests -p remote_capacity_retry_test.py
      - name: Test SSH message queues
        run: python -m unittest discover -s tests -p remote_queue_send_test.py
      - name: Test SSH snapshot parsing
        run: python -m unittest discover -s tests -p remote_snapshot_test.py
      - run: npm run build
      - name: Build verified runtime archive
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - name: Test bundled application
        run: node scripts/smoke-portable.mjs releases/codex-workbench-${{ matrix.target }}
      - name: Test passive Linux IPC observer
        if: runner.os == 'Linux'
        run: cat server/remote_read_events.py tests/remote_read_events_test.py | python3
      - uses: actions/upload-artifact@v4
        with:
          name: codex-workbench-${{ matrix.target }}
          path: |
            releases/*.zip
            releases/*.tar.gz
          if-no-files-found: error
